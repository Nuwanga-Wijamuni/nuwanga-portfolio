<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 166" width="700" height="166" role="img" aria-labelledby="nw-ai-workflow-title nw-ai-workflow-desc" color="#171717">
  <title id="nw-ai-workflow-title">AI agent workflow</title>
  <desc id="nw-ai-workflow-desc">Conceptual flow: input, retrieve, reason, human review, and action. Feedback returns to retrieval.</desc>
  <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" font-family="'Courier New', monospace">
<text x="10" y="18" font-size="11" stroke="none" fill="currentColor" >AGENT WORKFLOW / CONCEPT</text><g class="workflow-node node-0"><rect x="10" y="44" width="118" height="60" rx="5"/><text x="69" y="69" font-size="13" stroke="none" fill="currentColor" text-anchor="middle">INPUT</text><text x="69" y="87" font-size="10" stroke="none" fill="currentColor" text-anchor="middle">Question</text></g><g class="workflow-edge"><line x1="128" y1="74" x2="144" y2="74" /><path d="M 139 70 L 144 74 L 139 78"/></g><g class="workflow-node node-1"><rect x="150" y="44" width="118" height="60" rx="5"/><text x="209" y="69" font-size="13" stroke="none" fill="currentColor" text-anchor="middle">RETRIEVE</text><text x="209" y="87" font-size="10" stroke="none" fill="currentColor" text-anchor="middle">Sources</text></g><g class="workflow-edge"><line x1="268" y1="74" x2="284" y2="74" /><path d="M 279 70 L 284 74 L 279 78"/></g><g class="workflow-node node-2"><rect x="290" y="44" width="118" height="60" rx="5"/><text x="349" y="69" font-size="13" stroke="none" fill="currentColor" text-anchor="middle">REASON</text><text x="349" y="87" font-size="10" stroke="none" fill="currentColor" text-anchor="middle">Context</text></g><g class="workflow-edge"><line x1="408" y1="74" x2="424" y2="74" /><path d="M 419 70 L 424 74 L 419 78"/></g><g class="workflow-node node-3"><rect x="430" y="44" width="118" height="60" rx="5"/><text x="489" y="69" font-size="13" stroke="none" fill="currentColor" text-anchor="middle">REVIEW</text><text x="489" y="87" font-size="10" stroke="none" fill="currentColor" text-anchor="middle">Approval</text></g><g class="workflow-edge"><line x1="548" y1="74" x2="564" y2="74" /><path d="M 559 70 L 564 74 L 559 78"/></g><g class="workflow-node node-4"><rect x="570" y="44" width="118" height="60" rx="5"/><text x="629" y="69" font-size="13" stroke="none" fill="currentColor" text-anchor="middle">ACTION</text><text x="629" y="87" font-size="10" stroke="none" fill="currentColor" text-anchor="middle">Tool call</text></g><path class="feedback-edge" d="M 489 104 V 134 H 209 V 104" stroke-dasharray="4 5"/><path d="M 205 111 L 209 104 L 213 111"/><text x="350" y="150" font-size="10" stroke="none" fill="currentColor" text-anchor="middle">REVISE / RETRIEVE AGAIN</text>
  </g>
</svg>
