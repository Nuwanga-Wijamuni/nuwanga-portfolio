<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="480" height="240" role="img" aria-labelledby="nw-retrieval-network-title nw-retrieval-network-desc" color="#171717">
  <title id="nw-retrieval-network-title">Retrieval network</title>
