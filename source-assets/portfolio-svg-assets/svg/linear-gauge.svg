<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 102" width="300" height="102" role="img" aria-labelledby="nw-linear-gauge-title nw-linear-gauge-desc" color="#171717">
  <title id="nw-linear-gauge-title">Linear signal gauge</title>
  <desc id="nw-linear-gauge-desc">Illustrative 60 percent bar with a tick scale. Not live data.</desc>
  <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" font-family="'Courier New', monospace">
<text x="10" y="20" font-size="11" stroke="none" fill="currentColor" >SIGNAL / DEMO</text><text x="290" y="20" font-size="11" stroke="none" fill="currentColor" text-anchor="end">0 — 1</text><rect class="gauge-track" x="10" y="36" width="280" height="14" rx="7"/><rect class="gauge-fill" x="12" y="38" width="168" height="10" rx="5" fill="currentColor" stroke="none"/><line x1="10" y1="60" x2="10" y2="70" /><line x1="30" y1="60" x2="30" y2="64" /><line x1="50" y1="60" x2="50" y2="64" /><line x1="70" y1="60" x2="70" y2="64" /><line x1="90" y1="60" x2="90" y2="64" /><line x1="110" y1="60" x2="110" y2="70" /><line x1="130" y1="60" x2="130" y2="64" /><line x1="150" y1="60" x2="150" y2="64" /><line x1="170" y1="60" x2="170" y2="64" /><line x1="190" y1="60" x2="190" y2="64" /><line x1="210" y1="60" x2="210" y2="70" /><line x1="230" y1="60" x2="230" y2="64" /><line x1="250" y1="60" x2="250" y2="64" /><line x1="270" y1="60" x2="270" y2="64" /><line x1="290" y1="60" x2="290" y2="64" /><text x="10" y="89" font-size="9" stroke="none" fill="currentColor" >ILLUSTRATIVE / NOT LIVE DATA</text>
  </g>
</svg>
